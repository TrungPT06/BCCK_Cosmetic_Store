defaultTasks 'clean', 'test', 'aggregate'

repositories {
    mavenCentral()
    mavenLocal()
}

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    configurations.classpath {
        resolutionStrategy.force(
            "com.fasterxml.jackson.core:jackson-annotations:2.22",
            "com.fasterxml.jackson.core:jackson-core:2.22.4",
            "com.fasterxml.jackson.core:jackson-databind:2.22.4",
            "com.google.guava:guava:33.7.2-jre",
            "io.appium:java-client:10.1.1",
            "io.opentelemetry:opentelemetry-api:1.67.0",
            // Serenity's Thymeleaf 3.1.3 report renderer requires this API.
            // OGNL 3.4 removed OgnlContext(MemberAccess, ClassResolver,
            // TypeConverter, Map), which made the aggregate/report task fail.
            "ognl:ognl:3.3.4",
            "org.freemarker:freemarker:2.3.35",
            "org.jsoup:jsoup:1.23.2",
            "org.thymeleaf:thymeleaf:3.1.5.RELEASE"
        )
    }
    dependencies {
        classpath "net.serenity-bdd:serenity-gradle-plugin:5.3.2"
        classpath "net.serenity-bdd:serenity-single-page-report:5.3.2"
    }
}


apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: "net.serenity-bdd.serenity-gradle-plugin"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    serenity_version = '5.3.2'
    junit_platform_launcher_version="1.13.0"
    cucumber_junit_platform_engine_version="7.34.2"
    junit_platform_suite_version="6.0.3"
    junit_jupiter_engine_version="6.0.3"
    junit_vintage_engine_version="6.0.3"
    logback_classic_version="1.5.34"
    assertj_core_version="3.27.7"
}

dependencies {
    dependencies {
        testImplementation "net.serenity-bdd:serenity-core:${serenity_version}"
        testImplementation "net.serenity-bdd:serenity-cucumber:${serenity_version}"
        testImplementation "net.serenity-bdd:serenity-screenplay:${serenity_version}"
        testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenity_version}"
        testImplementation "net.serenity-bdd:serenity-ensure:${serenity_version}"
        testImplementation "org.junit.platform:junit-platform-launcher:${junit_platform_launcher_version}"
        testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumber_junit_platform_engine_version}"
        testImplementation "org.junit.platform:junit-platform-suite:${junit_platform_suite_version}"
        testImplementation "org.junit.jupiter:junit-jupiter-engine:${junit_jupiter_engine_version}"
        testImplementation "org.junit.vintage:junit-vintage-engine:${junit_vintage_engine_version}"
        implementation "ch.qos.logback:logback-classic:${logback_classic_version}"
        testImplementation "org.assertj:assertj-core:${assertj_core_version}"
        constraints {
            implementation "ch.qos.logback:logback-core:1.5.34"
            implementation "com.fasterxml.jackson.core:jackson-annotations:2.22"
            implementation "com.fasterxml.jackson.core:jackson-core:2.22.4"
            implementation "com.fasterxml.jackson.core:jackson-databind:2.22.4"
            implementation "com.google.guava:guava:33.7.2-jre"
            implementation "io.appium:java-client:10.1.1"
            implementation "io.opentelemetry:opentelemetry-api:1.67.0"
            implementation "org.freemarker:freemarker:2.3.35"
            implementation "org.jsoup:jsoup:1.23.2"
        }
    }
}

test {
    useJUnitPlatform()
    // Keeps a feature slice independently executable while other feature slices are implemented.
    systemProperty "cucumber.filter.tags", System.getProperty("cucumber.filter.tags", "")
}

serenity {
    reports = ["single-page-html"]
}
gradle.startParameter.continueOnFailure = true

test.finalizedBy(aggregate, reports)
